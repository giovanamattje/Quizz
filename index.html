<!DOCTYPE html>
<html lang="pr-BR">
<head>
    <meta charset="UTF-8">
    <!--width=device-width, initial-scale=1.0: -->
    <!--ajuda na adaptação a diferentes tipos de telas(celulares) -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz do milhão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="jogo">
        <header>
            <h1>QUIZ DO MILHÃO</h1>
            <p id="categoria">Categoria: Conhecimentos Gerais</p>
            <!--head e pro navegador e header o usuario ve -->
        </header>
        <section class="painel">
            <div class="status">
                <span id="numero-pergunta">Pergunta 1 de 5</span>
                <span id="premio">Prêmio: R$ 0</span>
            </div>
            <h2 id="pergunta">Careegando pergunta...</h2>
            <div id="alternativas" class="alternativas"></div>
            <p id="mensagem" class="mensagem"></p>
            <button d="proxima" class = "botao-proxima" disabled>
                Próxima Pergunta
            </button>
        </section>

     

    </main>
    <script src="script.js"></script>
</body>








</html>
