<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz do milhão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="jogo">
        <header>
            <a href="https://www.gigaglitters.com/g/09x962t9dhv"><img src="https://www.gigaglitters.com/g/09x962t9dhv.gif" width="544" height="86" alt="Quizz do Milhão glitter"></a>
            <p id="categoria">Categoria: Programação</p>
        </header>
        
        <section class="painel">
            <div class="status">
                <span id="numero-pergunta">Pergunta 1 de 5</span>
                <span id="premio">Prêmio: R$ 0</span>
            </div>
            
            <h2 id="pergunta">Carregando pergunta...</h2>
            <div id="alternativas" class="alternativas"></div>
            <p id="mensagem" class="mensagem"></p>
            
            
            <button id="proxima" class="botao-proxima" disabled> Próxima Pergunta </button>
        </section>
    </main>

    <footer class="rodape">
        <audio controls autoplay loop>   
            <source id="musica" src="musica/Petunia.mp3" type="audio/mpeg">
        </audio>
    </footer>

    <script src="script.js"></script>


</body>
</html>
